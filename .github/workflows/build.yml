name: build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  # The core test suite needs no Android SDK and no Maven Central: it compiles with kotlinc and
  # runs on a plain JRE, so this job is fast and cannot be blocked by a dependency outage.
  core-tests:
    name: Core tests (kotlinc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: ./tools/setup-toolchain.sh
      - name: Run core tests
        run: ./tools/run-tests.sh
      - name: Type-check the Compose UI against the compile-only stubs
        run: ./tools/check-ui.sh
      - name: Smoke-test the CLI demo against recorded fixtures
        run: ./tools/run-demo.sh --fixtures shared/src/desktopTest/fixtures --silent session

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Generate the Gradle wrapper
        run: gradle wrapper --gradle-version 8.11.1 --stacktrace
      - name: Assemble
        run: ./gradlew :composeApp:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: omnimusic-android-debug
          path: composeApp/build/outputs/apk/debug/*.apk

  desktop:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Generate the Gradle wrapper
        run: gradle wrapper --gradle-version 8.11.1 --stacktrace
      - name: Make sure Inno Setup is available
        if: matrix.os == 'windows-latest'
        run: pwsh -File tools/ensure-innosetup.ps1
      - name: Discard any cached compose output
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          # The launch smoke test found a bundled runtime with no bin/java.exe in it while
          # createRuntimeImage was UP-TO-DATE from an earlier run. Regenerating it from scratch
          # says whether that was a stale cache or how the image really is - and an installer
          # built from a fresh runtime is the one worth shipping either way.
          if (Test-Path composeApp/build/compose) {
            Remove-Item composeApp/build/compose -Recurse -Force
            Write-Host "removed composeApp/build/compose"
          }
      - name: Package for this OS
        run: ./gradlew :composeApp:packageDistributionForCurrentOS --stacktrace
      - name: Create the app image the smoke test launches
        if: matrix.os == 'windows-latest'
        run: ./gradlew :composeApp:createDistributable --stacktrace
      - name: Smoke-test that the packaged JVM starts
        if: matrix.os == 'windows-latest'
        run: pwsh -File tools/smoke-windows-launch.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: omnimusic-desktop-${{ matrix.os }}
          path: |
            composeApp/build/compose/binaries/main/**/*.deb
            composeApp/build/compose/binaries/main/**/*.dmg
            composeApp/build/compose/binaries/main/exe/*.exe
