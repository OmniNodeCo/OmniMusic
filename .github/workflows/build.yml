name: build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  # The core test suite needs no Android SDK and no Maven Central: it compiles with kotlinc and
  # runs on a plain JRE, so this job is fast and cannot be blocked by a dependency outage.
  core-tests:
    name: Core tests (kotlinc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: ./tools/setup-toolchain.sh
      - name: Run core tests
        run: ./tools/run-tests.sh
      - name: Type-check the Compose UI against the compile-only stubs
        run: ./tools/check-ui.sh
      - name: Smoke-test the CLI demo against recorded fixtures
        run: ./tools/run-demo.sh --fixtures shared/src/desktopTest/fixtures --silent session

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Generate the Gradle wrapper
        shell: bash
        run: |
          gradle --version
          if ! out="$(gradle wrapper --gradle-version 8.11.1 --stacktrace 2>&1)"; then
            printf '%s\n' "$out"
            # Job logs are served from a host that is not reachable from every environment, so
            # surface the diagnosis as annotations, which the REST API does return.
            printf '%s\n' "$out" \
              | grep -E '^\* |FAILURE|What went wrong|Caused by:|error:|Execution failed|Could not |Unsupported |requires Gradle' \
              | tail -n 25 \
              | while IFS= read -r line; do printf '::error::%s\n' "${line:0:300}"; done
            exit 1
          fi
          printf '%s\n' "$out"
      - name: Assemble
        run: ./gradlew :composeApp:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: omnimusic-android-debug
          path: composeApp/build/outputs/apk/debug/*.apk

  desktop:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Generate the Gradle wrapper
        shell: bash
        run: |
          gradle --version
          if ! out="$(gradle wrapper --gradle-version 8.11.1 --stacktrace 2>&1)"; then
            printf '%s\n' "$out"
            # Job logs are served from a host that is not reachable from every environment, so
            # surface the diagnosis as annotations, which the REST API does return.
            printf '%s\n' "$out" \
              | grep -E '^\* |FAILURE|What went wrong|Caused by:|error:|Execution failed|Could not |Unsupported |requires Gradle' \
              | tail -n 25 \
              | while IFS= read -r line; do printf '::error::%s\n' "${line:0:300}"; done
            exit 1
          fi
          printf '%s\n' "$out"
      - name: Package for this OS
        run: ./gradlew :composeApp:packageDistributionForCurrentOS --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: omnimusic-desktop-${{ matrix.os }}
          path: |
            composeApp/build/compose/binaries/main/**/*.deb
            composeApp/build/compose/binaries/main/**/*.dmg
            composeApp/build/compose/binaries/main/**/*.msi
