name: release

# Cutting a release means pushing a tag: git tag v0.1.0 && git push origin v0.1.0
#
# The build workflow already proves every push compiles and packages; this one turns a tag into
# something a person can actually download, by publishing the four artifacts as a GitHub release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Generate the Gradle wrapper
        run: gradle wrapper --gradle-version 8.11.1 --stacktrace
      - name: Assemble the release APK
        run: ./gradlew :composeApp:assembleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: omnimusic-android
          path: composeApp/build/outputs/apk/release/*.apk

  desktop:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Generate the Gradle wrapper
        run: gradle wrapper --gradle-version 8.11.1 --stacktrace
      - name: Package for this OS
        run: ./gradlew :composeApp:packageDistributionForCurrentOS --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: omnimusic-desktop-${{ matrix.os }}
          path: |
            composeApp/build/compose/binaries/main/**/*.deb
            composeApp/build/compose/binaries/main/**/*.dmg
            composeApp/build/compose/binaries/main/**/*.msi

  publish:
    name: Publish the release
    runs-on: ubuntu-latest
    needs: [android, desktop]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: omnimusic-
          merge-multiple: true
          path: dist

      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # A manual dispatch has no tag to publish under, so it produces a prerelease named after
          # the commit instead of pretending to be a version. That makes the workflow testable
          # without cutting a release nobody asked for.
          prerelease=""
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tag="${GITHUB_REF_NAME}"
            title="OmniMusic ${tag#v}"
          else
            tag="manual-$(git rev-parse --short HEAD)"
            title="OmniMusic manual build $(git rev-parse --short HEAD)"
            prerelease="--prerelease"
          fi

          mapfile -t files < <(find dist -type f | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::no artifacts were collected, nothing to publish"
            exit 1
          fi
          printf 'publishing %d file(s):\n' "${#files[@]}"
          printf '  %s\n' "${files[@]}"

          {
            echo "OmniMusic ${tag#v} — an Android APK plus native packages for Linux, macOS and Windows."
            echo
            echo "- \`*-release.apk\`: signed with the debug key, so it installs directly but is not Play-ready."
            echo "- \`.deb\` / \`.dmg\` / \`.msi\`: built by \`packageDistributionForCurrentOS\` on each OS."
            echo
            echo "Compiled and packaged by CI. No human has opened a window in any of these — see the"
            echo "verification section of the README for exactly what has and has not been exercised."
          } > notes.md

          # Re-running a tag should replace the release rather than fail on the name.
          gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$tag" "${files[@]}" \
            --title "$title" \
            --notes-file notes.md \
            $prerelease
