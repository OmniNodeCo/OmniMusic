name: Build desktop packages (per-OS runners)

# Four-job pipeline, one native runner per target OS:
#
#   1) build-linux   (ubuntu-22.04) — Conveyor `make linux-app` → unpacked
#      tree, wrapped into a portable .AppImage by appimagetool.
#   2) build-macos   (macos-14)     — Conveyor `make site` for
#      mac.amd64 + mac.aarch64 → unnotarized .zip per arch.
#   3) build-windows (windows-latest) — Conveyor `make site` for
#      windows.amd64 → .msix, bundled with install.bat + the signing cert.
#   4) wrap-mac-dmg  (macos-14, needs 2) — wraps each mac .zip into a
#      polished .dmg. Needs macOS because `create-dmg` + `hdiutil` are
#      macOS-only, but it's fast since it does no compilation.
#
# Why per-OS runners instead of one Linux cross-build:
#  - Each target compiles and packages on the OS it ships on, so a failure
#    in one target no longer skips the other two.
#  - Only the mpv slice for that OS is staged, so each job downloads a
#    fraction of the natives `mpvSetupAll` pulled.
#
# Conveyor installation note:
#  - The official `hydraulic-software/conveyor/actions/build` action is
#    Linux-ONLY — it hard-exits with "This action must be run in a Linux
#    runner" and downloads only the linux-amd64 tarball. So each job
#    installs Conveyor itself from downloads.hydraulic.dev, using the
#    per-OS archives published on Conveyor's download page.
#  - The executable is located with `find` after extraction rather than a
#    hardcoded path, because the mac .zip / windows .zip layouts differ
#    from the Linux tarball's `conveyor-<version>/bin/` shape.

on:
  workflow_dispatch:
  push:
    branches:
      - 'dev'
    paths-ignore:
      - 'README.md'
      - 'fastlane/**'
      - 'assets/**'
      - '.github/**/*.md'
      - '.github/ISSUE_TEMPLATE/**'

permissions:
  contents: write

env:
  # Pin centrally — bumping this changes all three OS jobs at once.
  # Matches the version the repo was developed against (Conveyor 22.0).
  CONVEYOR_VERSION: "22.0"

jobs:
  # ---------------------------------------------------------------- Linux
  build-linux:
    name: Linux — AppImage
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'recursive'

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: "microsoft"
          cache: 'gradle'

      - name: Install libfuse2
        # Needed by appimagetool when wrapping the Linux app. Nothing else is
        # required here: mpvSetupLinuxCi only downloads and untars the prebuilt
        # native slice, so no 7-Zip, patchelf or dwarfs toolchain on the runner.
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2

      - name: Update build product flavor
        run: |
          echo "" >> ./gradle.properties
          echo "isFullBuild=true" >> ./gradle.properties

      - name: Update Sentry Secrets
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN_JVM }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          echo 'SENTRY_DSN=${{ secrets.SENTRY_DSN_JVM }}' > ./local.properties
          echo "SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}" >> ./local.properties

      - name: Update Last.fm secrets
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
        run: |
          echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" >> ./local.properties
          echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> ./local.properties

      - name: Generate aboutLibraries.json
        run: ./gradlew exportLibraryDefinitions

      # Per-OS cache key: all three jobs cache into `mpv-natives` but each
      # stages a different subset of slices, so a shared key would restore
      # one OS's slice set into another's job.
      - name: Cache mpv-natives (linux)
        uses: actions/cache@v4
        with:
          path: mpv-natives
          key: mpv-natives-linux-${{ hashFiles('composeApp/build.gradle.kts') }}

      - name: Stage libmpv (linux-x64)
        run: ./gradlew :composeApp:mpvSetupLinuxCi --no-configuration-cache

      - name: Generate Conveyor config
        # Run writeConveyorConfig BEFORE Conveyor so the parser only reads
        # the static generated.conveyor.conf and never tastes Gradle stdout
        # (which can contain plugin println output and break HOCON parsing).
        # This step dependsOn(proguardReleaseJars), so it is also where the
        # desktop target gets compiled and R8-shrunk.
        run: ./gradlew :desktopApp:writeConveyorConfig --no-configuration-cache

      - name: Install Conveyor
        run: |
          set -euo pipefail
          mkdir -p .conveyor/install
          curl -fL --retry 3 -o conveyor.tar.gz \
            "https://downloads.hydraulic.dev/conveyor/conveyor-${CONVEYOR_VERSION}-linux-amd64.tar.gz"
          tar xzf conveyor.tar.gz -C .conveyor/install
          CONV="$(find .conveyor/install -type f -name conveyor | head -1)"
          if [ -z "$CONV" ]; then
            echo "::error::conveyor executable not found after extraction"
            find .conveyor/install -maxdepth 3 | head -50
            exit 1
          fi
          chmod +x "$CONV"
          echo "CONVEYOR_BIN=$CONV" >> "$GITHUB_ENV"
          "$CONV" --version || true

      # `make linux-app` emits the unpacked tree under output/ that our
      # packageConveyorAppImage task wraps into a portable AppImage.
      # Conveyor 22.0 dropped native AppImage support, hence the wrap.
      - name: Run Conveyor (linux-app)
        env:
          SIGNING_KEY: ${{ secrets.CONVEYOR_SIGNING_KEY }}
          CONVEYOR_AGREE_TO_LICENSE: 1
        run: |
          set -euo pipefail
          # `tee` keeps the failure readable: the raw job log lives on a blob
          # host that is awkward to fetch from a sandbox, whereas an
          # annotation is retrievable straight from the REST API.
          "$CONVEYOR_BIN" --cache-dir=.conveyor/cache \
            "-Kapp.signing-key=$SIGNING_KEY" \
            -Kapp.machines=linux.amd64.glibc make linux-app 2>&1 | tee conveyor.log

      - name: Surface Conveyor failure as an annotation
        if: failure()
        run: |
          if [ ! -f conveyor.log ]; then
            echo "::error::conveyor.log not found - Conveyor never produced output"
            exit 0
          fi
          msg=$(tail -n 45 conveyor.log | tail -c 3000 \
                | sed -e 's/%/%25/g' -e 's/\r//g' \
                | awk '{if (NR>1) printf "%%0A"; printf "%s", $0}')
          echo "::error title=Conveyor failed (last 45 lines)::${msg}"

      - name: Wrap Linux app tree → AppImage
        run: ./gradlew :desktopApp:packageConveyorAppImage --no-configuration-cache

      - name: Stage AppImage into output/ for upload
        run: cp desktopApp/build/appimage/conveyor/OmniMusic-*.AppImage output/

      - name: Show built artifacts
        run: ls -lh output/

      - name: Upload AppImage to run artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-appimage
          path: output/OmniMusic-*.AppImage

  # ---------------------------------------------------------------- macOS
  build-macos:
    name: macOS — .zip (aarch64 + amd64)
    runs-on: macos-14
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'recursive'

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: "microsoft"
          cache: 'gradle'

      - name: Update build product flavor
        run: |
          echo "" >> ./gradle.properties
          echo "isFullBuild=true" >> ./gradle.properties

      - name: Update Sentry Secrets
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN_JVM }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          echo 'SENTRY_DSN=${{ secrets.SENTRY_DSN_JVM }}' > ./local.properties
          echo "SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}" >> ./local.properties

      - name: Update Last.fm secrets
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
        run: |
          echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" >> ./local.properties
          echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> ./local.properties

      - name: Generate aboutLibraries.json
        run: ./gradlew exportLibraryDefinitions

      - name: Cache mpv-natives (macos)
        uses: actions/cache@v4
        with:
          path: mpv-natives
          key: mpv-natives-macos-${{ hashFiles('composeApp/build.gradle.kts') }}

      # Both arches: macos-14 is Apple Silicon, but Conveyor packages the
      # Intel .zip from the same JVM payload, so one runner covers both.
      - name: Stage libmpv (macos-arm64 + macos-x64)
        run: ./gradlew :composeApp:mpvSetupMacArmCi :composeApp:mpvSetupMacX64Ci --no-configuration-cache

      - name: Generate Conveyor config
        run: ./gradlew :desktopApp:writeConveyorConfig --no-configuration-cache

      - name: Install Conveyor
        run: |
          set -euo pipefail
          mkdir -p .conveyor/install
          curl -fL --retry 3 -o conveyor.zip \
            "https://downloads.hydraulic.dev/conveyor/conveyor-${CONVEYOR_VERSION}-mac-aarch64.zip"
          unzip -q conveyor.zip -d .conveyor/install
          CONV="$(find .conveyor/install -type f \( -name conveyor -o -name conveyor.sh \) | head -1)"
          if [ -z "$CONV" ]; then
            echo "::error::conveyor executable not found after extraction"
            find .conveyor/install -maxdepth 4 | head -50
            exit 1
          fi
          chmod +x "$CONV"
          # Unsigned download → strip the quarantine xattr or Gatekeeper
          # blocks execution on a fresh runner.
          xattr -dr com.apple.quarantine .conveyor/install 2>/dev/null || true
          echo "CONVEYOR_BIN=$CONV" >> "$GITHUB_ENV"
          "$CONV" --version || true

      # `make site` restricted to the two mac machines. `-Kapp.machines`
      # stops Conveyor re-entering the Linux/Windows pipelines, whose mpv
      # slices this runner never staged.
      - name: Run Conveyor (mac.amd64 + mac.aarch64)
        env:
          SIGNING_KEY: ${{ secrets.CONVEYOR_SIGNING_KEY }}
          CONVEYOR_AGREE_TO_LICENSE: 1
        run: |
          set -euo pipefail
          "$CONVEYOR_BIN" --cache-dir=.conveyor/cache \
            "-Kapp.signing-key=$SIGNING_KEY" \
            '-Kapp.machines=[mac.amd64,mac.aarch64]' make site 2>&1 | tee conveyor.log

      - name: Surface Conveyor failure as an annotation
        if: failure()
        run: |
          if [ ! -f conveyor.log ]; then
            echo "::error::conveyor.log not found - Conveyor never produced output"
            exit 0
          fi
          msg=$(tail -n 45 conveyor.log | tail -c 3000 \
                | sed -e 's/%/%25/g' -e 's/\r//g' \
                | awk '{if (NR>1) printf "%%0A"; printf "%s", $0}')
          echo "::error title=Conveyor failed (last 45 lines)::${msg}"

      - name: Show built artifacts
        run: ls -lh output/

      - name: Upload macOS zips to run artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-mac-zips
          path: output/*.zip

  # -------------------------------------------------------------- Windows
  build-windows:
    name: Windows — .msix + offline installer
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'recursive'

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: "microsoft"
          cache: 'gradle'

      - name: Update build product flavor
        run: |
          echo "" >> ./gradle.properties
          echo "isFullBuild=true" >> ./gradle.properties

      - name: Update Sentry Secrets
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN_JVM }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          echo 'SENTRY_DSN=${{ secrets.SENTRY_DSN_JVM }}' > ./local.properties
          echo "SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}" >> ./local.properties

      - name: Update Last.fm secrets
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
        run: |
          echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" >> ./local.properties
          echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> ./local.properties

      - name: Generate aboutLibraries.json
        run: ./gradlew exportLibraryDefinitions

      - name: Cache mpv-natives (windows)
        uses: actions/cache@v4
        with:
          path: mpv-natives
          key: mpv-natives-windows-${{ hashFiles('composeApp/build.gradle.kts') }}

      # Only x64 — windows.aarch64 is dropped because androidx.sqlite-bundled
      # lacks a Windows ARM64 native (see conveyor.conf). ARM Windows users
      # get the x64 msix under Prism emulation.
      - name: Stage libmpv (windows-x64)
        run: ./gradlew :composeApp:mpvSetupWindowsX64Ci --no-configuration-cache

      - name: Generate Conveyor config
        run: ./gradlew :desktopApp:writeConveyorConfig --no-configuration-cache

      # pwsh, not bash: Expand-Archive is guaranteed present, whereas
      # `unzip` is not part of the Windows runner image.
      - name: Install Conveyor
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ver = $env:CONVEYOR_VERSION
          New-Item -ItemType Directory -Force -Path ".conveyor/install" | Out-Null
          Invoke-WebRequest -Uri "https://downloads.hydraulic.dev/conveyor/conveyor-$ver-windows-amd64.zip" `
            -OutFile "conveyor.zip"
          Expand-Archive -Path "conveyor.zip" -DestinationPath ".conveyor/install" -Force
          $conv = Get-ChildItem -Path ".conveyor/install" -Recurse -File -Include "conveyor.exe","conveyor.bat","conveyor.cmd" |
                  Select-Object -First 1
          if (-not $conv) {
            Write-Error "conveyor executable not found after extraction"
            Get-ChildItem -Path ".conveyor/install" -Recurse -Depth 3 | Select-Object -First 50
            exit 1
          }
          "CONVEYOR_BIN=$($conv.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Conveyor at $($conv.FullName)"

      - name: Run Conveyor (windows.amd64)
        env:
          SIGNING_KEY: ${{ secrets.CONVEYOR_SIGNING_KEY }}
          CONVEYOR_AGREE_TO_LICENSE: 1
        run: |
          set -euo pipefail
          # A .bat launcher needs cmd.exe; a .exe is invoked directly.
          case "$CONVEYOR_BIN" in
            *.bat|*.cmd) cmd //c "$CONVEYOR_BIN" --cache-dir=.conveyor/cache \
                           "-Kapp.signing-key=$SIGNING_KEY" \
                           -Kapp.machines=windows.amd64 make site 2>&1 | tee conveyor.log ;;
            *)           "$CONVEYOR_BIN" --cache-dir=.conveyor/cache \
                           "-Kapp.signing-key=$SIGNING_KEY" \
                           -Kapp.machines=windows.amd64 make site 2>&1 | tee conveyor.log ;;
          esac

      - name: Surface Conveyor failure as an annotation
        if: failure()
        run: |
          if [ ! -f conveyor.log ]; then
            echo "::error::conveyor.log not found - Conveyor never produced output"
            exit 0
          fi
          msg=$(tail -n 45 conveyor.log | tail -c 3000 \
                | sed -e 's/%/%25/g' -e 's/\r//g' \
                | awk '{if (NR>1) printf "%%0A"; printf "%s", $0}')
          echo "::error title=Conveyor failed (last 45 lines)::${msg}"

      # Bundle Windows installer = install.bat + omnimusic.crt + msix.
      # Conveyor's default .exe wrapper + .appinstaller fetch URLs from
      # `site.base-url` (GitHub Releases /latest/download/) which 404 for
      # unreleased builds, so we ship our own scripts/windows/install.bat
      # that trusts the cert and sideloads the msix offline.
      - name: Bundle Windows offline installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (-not (Test-Path "output/omnimusic.crt")) {
            Write-Error "output/omnimusic.crt missing - Conveyor signing must have failed"
            exit 1
          }
          $msix = Get-ChildItem -Path "output" -Filter "omnimusic-*.x64.msix" | Select-Object -First 1
          if (-not $msix) {
            Write-Error "No omnimusic-*.x64.msix found in output/"
            exit 1
          }
          New-Item -ItemType Directory -Force -Path "installers" | Out-Null
          $stage = Join-Path $env:RUNNER_TEMP ("installer-" + [guid]::NewGuid().ToString("N"))
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "scripts/windows/install.bat" $stage
          Copy-Item "output/omnimusic.crt"        $stage
          Copy-Item $msix.FullName                $stage
          Compress-Archive -Path (Join-Path $stage "*") `
            -DestinationPath "$PWD/installers/OmniMusic-Windows-installer.zip" -Force
          Remove-Item -Recurse -Force $stage
          Get-ChildItem installers | Format-Table Name,Length

      - name: Upload Windows offline installer
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: installers/OmniMusic-Windows-installer.zip

  # ------------------------------------------------------------ Mac .dmg
  wrap-mac-dmg:
    name: Wrap macOS .zip → .dmg (installer UX)
    runs-on: macos-14
    needs: build-macos
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - name: Install create-dmg + ImageMagick
        # create-dmg = sindresorhus brew formula. ImageMagick is used to
        # downscale the 2800x1600 source background to a sharp 1400x800
        # bitmap using a Lanczos filter (matches the DMG window size).
        run: brew install create-dmg imagemagick

      - name: Read app version
        id: version
        run: |
          VERSION=$(grep '^version-name' gradle/libs.versions.toml | head -1 | cut -d'"' -f2)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "App version: $VERSION"

      - name: Download Mac .zip artifacts
        uses: actions/download-artifact@v4
        with:
          name: desktop-mac-zips
          path: mac-zips

      - name: Prepare background (Lanczos resize 2800x1600 → 1400x800)
        run: |
          mkdir -p build/dmg
          magick composeApp/icon/dmg-background.png \
            -filter Lanczos -resize 1400x800 \
            build/dmg/dmg-bg-1400x800.png

      - name: Wrap each Mac .zip into a polished .dmg
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          shopt -s nullglob
          for zip in mac-zips/omnimusic-*-mac-*.zip; do
            arch="$(basename "$zip" | sed -nE 's/.*-mac-([a-z0-9]+)\.zip/\1/p')"
            [[ -z "$arch" ]] && { echo "Cannot infer arch from $zip" >&2; exit 1; }
            workdir="$(mktemp -d)"
            unzip -q "$zip" -d "$workdir"
            app="$(find "$workdir" -maxdepth 2 -type d -name '*.app' | head -1)"
            [[ -d "$app" ]] || { echo "No .app inside $zip" >&2; exit 1; }
            out="dist/OmniMusic-${VERSION}-mac-${arch}.dmg"
            scripts/wrap-mac-dmg.sh \
              "$app" \
              build/dmg/dmg-bg-1400x800.png \
              composeApp/icon/circle_app_icon.icns \
              "$out"
            rm -rf "$workdir"
          done
          ls -lh dist/

      - name: Upload Mac .dmg artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-mac-dmg
          path: dist/*.dmg
